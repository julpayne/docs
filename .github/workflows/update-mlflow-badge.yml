name: Update MLflow badge

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-mlflow-badge.yml

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README badges
        run: |
          pip install pyyaml --quiet
          python3 <<'PY'
          import re
          import urllib.request
          from pathlib import Path

          import yaml

          branches = ["rhoai-3.4", "rhoai-3.5-ea.1", "rhoai-3.5-ea.2"]
          badge_lines = []

          for branch in branches:
              url = (
                  "https://raw.githubusercontent.com/red-hat-data-services/mlflow-operator/"
                  f"{branch}/config/component_metadata.yaml"
              )
              with urllib.request.urlopen(url) as response:
                  data = yaml.safe_load(response.read().decode())

              version = next(
                  release["version"]
                  for release in data["releases"]
                  if release["name"] == "MLflow"
              )

              label = branch.replace("-", "--")
              badge_url = f"https://img.shields.io/badge/{label}-{version}-0194E2"
              yaml_url = (
                  "https://github.com/red-hat-data-services/mlflow-operator/blob/"
                  f"{branch}/config/component_metadata.yaml"
              )
              badge_lines.append(f"[![{branch}]({badge_url})]({yaml_url})")
              print(f"{branch}: {version}")

          readme = Path("README.md").read_text()
          replacement = (
              "<!-- mlflow-badges:start -->\n"
              + "\n".join(badge_lines)
              + "\n<!-- mlflow-badges:end -->"
          )
          updated = re.sub(
              r"<!-- mlflow-badges:start -->.*?<!-- mlflow-badges:end -->",
              replacement,
              readme,
              count=1,
              flags=re.DOTALL,
          )
          Path("README.md").write_text(updated)
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update MLflow version badges"
            git push
          fi

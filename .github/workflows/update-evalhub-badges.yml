name: Update EvalHub badges

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-evalhub-badges.yml

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update README badges
        run: |
          python3 <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          clusters = [
              {
                  "name": "evalhub-prabhu:prabhu-comhub",
                  "health_url": (
                      "https://evalhub-prabhu.apps.rosa.prabhu-comhub.xqmp.p3.openshiftapps.com/api/v1/health"
                  ),
              },
          ]

          badge_lines = []

          for cluster in clusters:
              name = cluster["name"]
              health_url = cluster["health_url"]

              with urllib.request.urlopen(health_url) as response:
                  data = json.loads(response.read().decode())

              build = data["build"]
              label = name.replace("-", "--")
              badge_url = f"https://img.shields.io/badge/{label}-{build}-007ACC"
              badge_lines.append(f"[![{name}]({badge_url})]({health_url})")
              print(f"{name}: {build}")

          readme = Path("README.md").read_text()
          replacement = (
              "<!-- evalhub-badges:start -->\n"
              + "\n".join(badge_lines)
              + "\n<!-- evalhub-badges:end -->"
          )
          updated = re.sub(
              r"<!-- evalhub-badges:start -->.*?<!-- evalhub-badges:end -->",
              replacement,
              readme,
              count=1,
              flags=re.DOTALL,
          )
          Path("README.md").write_text(updated)
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update EvalHub cluster version badges"
            git push
          fi
